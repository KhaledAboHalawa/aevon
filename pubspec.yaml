name: aevon
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.9.2
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  injectable: ^3.0.0
  intl: any
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  injectable_generator: ^3.1.0

  flutter_test:
    sdk: flutter


flutter:
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/Baloo_Thambi_2/

  fonts:
    - family: BalooThambi2
      fonts:
        - asset: assets/fonts/Baloo_Thambi_2/BalooThambi2-Regular.ttf
          weight: 400
        - asset: assets/fonts/Baloo_Thambi_2/BalooThambi2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo_Thambi_2/BalooThambi2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo_Thambi_2/BalooThambi2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo_Thambi_2/BalooThambi2-ExtraBold.ttf
          weight: 800
  uses-material-design: true